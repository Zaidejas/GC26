<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Soaring Plane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e9dcb6; --paper-dark: #cdb98a; --ink: #3a2a18; --ink-soft: #6b5232;
    --olive: #3b4a2c; --olive-dark: #263019; --brass: #b08d48; --brass-light: #dcc082;
    --red: #8e2a1e;
  }
  html, body { margin: 0; height: 100%; background: #1c1f22; overflow: hidden; }
  body { font-family: 'Special Elite', 'Courier New', monospace; color: var(--ink); -webkit-user-select: none; user-select: none; }
  #wrap { position: absolute; left: 0; top: 0; width: 480px; height: 720px; transform-origin: 0 0; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  canvas#game { position: absolute; inset: 0; width: 480px; height: 720px; display: block; touch-action: none; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; }
  .screen.on { display: flex; }

  /* ---------- Main menu ---------- */
  #menu { justify-content: space-between; padding: 34px 0 28px; box-sizing: border-box; pointer-events: none; }
  #menu > * { pointer-events: auto; }
  .poster {
    position: relative; width: 392px; padding: 18px 20px 16px; box-sizing: border-box; text-align: center;
    background:
      radial-gradient(ellipse at 18% 22%, rgba(120,80,30,.18), transparent 40%),
      radial-gradient(ellipse at 85% 80%, rgba(120,80,30,.22), transparent 45%),
      radial-gradient(ellipse at 60% 10%, rgba(255,255,255,.25), transparent 50%),
      var(--paper);
    border: 3px double var(--ink); outline: 6px solid var(--paper); box-shadow: 0 0 0 9px var(--ink-soft), 0 12px 30px rgba(0,0,0,.45);
    transform: rotate(-1.2deg);
  }
  .poster .top { font-size: 12px; letter-spacing: 3px; color: var(--ink-soft); }
  .poster h1 {
    margin: 4px 0 0; font-family: 'IM Fell English SC', Georgia, serif; font-weight: normal;
    font-size: 64px; line-height: .92; letter-spacing: 4px; color: var(--red);
    text-shadow: 2px 2px 0 var(--ink), 0 0 1px var(--ink);
  }
  .poster h1 span { display: block; font-size: 54px; color: var(--ink); text-shadow: 1px 1px 0 rgba(0,0,0,.25); letter-spacing: 10px; }
  .poster .rule { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; color: var(--ink); font-size: 14px; }
  .poster .rule::before, .poster .rule::after { content: ''; flex: 1; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); height: 2px; }
  .poster .sub { font-size: 13px; letter-spacing: 2px; color: var(--ink-soft); }
  .menu-buttons { margin-top: 40px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .btn {
    position: relative; font-family: 'IM Fell English SC', Georgia, serif; font-size: 28px; letter-spacing: 3px;
    width: 260px; padding: 10px 0 8px; cursor: pointer; color: var(--paper);
    background: linear-gradient(#4d5d3a, var(--olive) 55%, var(--olive-dark));
    border: 2px solid var(--brass); border-radius: 6px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.15), 0 5px 0 #1b2212, 0 8px 14px rgba(0,0,0,.4);
    text-shadow: 1px 1px 0 #000;
  }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), 0 2px 0 #1b2212; }
  .btn.big { font-size: 36px; width: 290px; padding: 12px 0 10px; background: linear-gradient(#a13a29, var(--red) 55%, #5e1a12); box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.15), 0 5px 0 #3b0f09, 0 8px 14px rgba(0,0,0,.4); }
  .btn:disabled { cursor: default; filter: grayscale(.85) brightness(.7); }
  .btn .soon { position: absolute; right: -10px; top: -10px; font-family: 'Special Elite', monospace; font-size: 11px; letter-spacing: 1px; background: var(--paper); color: var(--red); border: 1px solid var(--red); padding: 2px 6px; transform: rotate(8deg); }
  .menu-stats { display: flex; gap: 22px; font-size: 16px; color: var(--paper); text-shadow: 1px 1px 2px #000; background: rgba(20,24,18,.55); padding: 6px 14px; border-radius: 4px; border: 1px solid rgba(176,141,72,.6); }
  .menu-stats b { display: inline-flex; align-items: center; gap: 5px; }

  /* ---------- Game over ---------- */
  #over { justify-content: center; background: rgba(15,18,20,.35); }
  .panel { width: 330px; text-align: center; padding: 18px 20px 22px; box-sizing: border-box; background: var(--paper); border: 3px double var(--ink); box-shadow: 0 0 0 6px var(--paper), 0 0 0 8px var(--ink-soft), 0 14px 30px rgba(0,0,0,.5); }
  .panel h2 { margin: 0 0 6px; font-family: 'IM Fell English SC', Georgia, serif; font-weight: normal; font-size: 46px; color: var(--red); letter-spacing: 3px; }
  .panel .line { display: flex; justify-content: space-between; font-size: 18px; border-bottom: 1px dashed var(--ink-soft); padding: 6px 2px; }
  .panel .line b { display: inline-flex; gap: 5px; align-items: center; }
  .panel .newbest { color: var(--red); font-size: 15px; margin-top: 6px; min-height: 18px; letter-spacing: 1px; }
  .panel .btn { width: 100%; margin-top: 12px; font-size: 26px; }

  /* ---------- Store ---------- */
  #store { background: linear-gradient(#2c3324, #1b2016); color: var(--ink); }
  .store-head { width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; background: linear-gradient(#4d5d3a, var(--olive-dark)); border-bottom: 3px solid var(--brass); box-shadow: 0 4px 10px rgba(0,0,0,.5); z-index: 1; }
  .store-head h2 { margin: 0; font-family: 'IM Fell English SC', Georgia, serif; font-weight: normal; font-size: 32px; color: var(--paper); letter-spacing: 3px; text-shadow: 1px 1px 0 #000; }
  .store-head .back { font-family: 'Special Elite', monospace; font-size: 16px; padding: 6px 10px; cursor: pointer; background: var(--paper); color: var(--ink); border: 2px solid var(--brass); border-radius: 4px; }
  .store-head .wallet { display: inline-flex; align-items: center; gap: 6px; font-size: 20px; color: var(--paper); text-shadow: 1px 1px 0 #000; }
  .store-list { flex: 1; width: 100%; overflow-y: auto; padding: 14px 14px 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; -webkit-overflow-scrolling: touch; }
  .store-list::-webkit-scrollbar { width: 8px; } .store-list::-webkit-scrollbar-thumb { background: var(--brass); border-radius: 4px; }
  .card { background: var(--paper); border: 2px solid var(--ink-soft); box-shadow: 0 0 0 4px var(--paper), 0 0 0 5px var(--ink-soft), 0 8px 16px rgba(0,0,0,.45); margin: 5px; }
  .card.selected { box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px var(--red), 0 8px 16px rgba(0,0,0,.45); }
  .card canvas.preview { display: block; width: 100%; height: 150px; border-bottom: 2px solid var(--ink-soft); }
  .card .info { padding: 8px 12px 12px; }
  .card h3 { margin: 0 0 4px; font-family: 'IM Fell English SC', Georgia, serif; font-weight: normal; font-size: 26px; color: var(--ink); display: flex; align-items: baseline; gap: 8px; }
  .card h3 .num { font-family: 'Special Elite', monospace; font-size: 14px; color: var(--ink-soft); }
  .card .history { margin: 0 0 8px; font-size: 13px; line-height: 1.35; color: #4a3a26; }
  .card .specs { display: grid; grid-template-columns: 118px 1fr; gap: 3px 8px; font-size: 13px; margin: 0; }
  .card .specs dt { color: var(--ink-soft); }
  .card .specs dd { margin: 0; color: var(--ink); }
  .card .country { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .card .country canvas { width: 30px; height: 20px; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--ink-soft); }
  .card .cost { display: inline-flex; align-items: center; gap: 6px; font-size: 22px; }
  .card .buy { font-family: 'IM Fell English SC', Georgia, serif; font-size: 22px; letter-spacing: 2px; min-width: 130px; padding: 6px 12px 4px; cursor: pointer; color: var(--paper); background: linear-gradient(#a13a29, var(--red) 60%, #5e1a12); border: 2px solid var(--brass); border-radius: 5px; text-shadow: 1px 1px 0 #000; }
  .card .buy.select { background: linear-gradient(#4d5d3a, var(--olive) 55%, var(--olive-dark)); }
  .card .buy:disabled { cursor: default; filter: grayscale(.8) brightness(.8); }
  .card .need { font-size: 12px; color: var(--red); text-align: right; margin-top: 3px; }
  canvas.coin-ic { width: 22px; height: 22px; vertical-align: middle; }

  #btnSound { position: absolute; left: 12px; top: 12px; width: 38px; height: 38px; font-size: 22px; line-height: 1; cursor: pointer; color: #f2ead2; background: rgba(20,24,18,.5); border: 1px solid rgba(176,141,72,.7); border-radius: 6px; z-index: 3; padding: 0; }
  #menu.on ~ #btnSound { top: auto; bottom: 46px; }
  #btnSound.off { opacity: .55; }
  .panel .btn { margin-top: 10px; } .panel .region { font-size: 14px; letter-spacing: 2px; color: var(--ink-soft); margin-bottom: 4px; }
  .panel .pair { display: flex; gap: 10px; } .panel .pair .btn { font-size: 21px; letter-spacing: 1px; }
  #levels { background: linear-gradient(#2c3324, #1b2016); color: var(--ink); }
  .tabs { width: 100%; display: flex; background: #20271a; z-index: 1; }
  .tabs button { flex: 1; font-family: 'IM Fell English SC', Georgia, serif; font-size: 21px; letter-spacing: 2px; padding: 8px 0 6px; cursor: pointer; color: var(--paper-dark); background: #2f3826; border: 0; border-bottom: 3px solid transparent; }
  .tabs button.on { color: var(--paper); background: var(--olive); border-bottom-color: var(--brass-light); }
  .store-list { min-height: 0; } .card { flex: none; }
  .filter { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; flex: none; }
  .filter button { min-width: 42px; height: 32px; padding: 0 6px; cursor: pointer; font-family: inherit; font-size: 14px; color: var(--ink); background: var(--paper-dark); border: 2px solid transparent; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
  .filter button.on { border-color: var(--red); background: var(--paper); }
  canvas.flag { box-shadow: 0 0 0 1px rgba(0,0,0,.5); flex: none; }
  .card h3 { flex-wrap: wrap; align-items: center; } .card h3 .fl:empty { display: none; } .card h3 .fl { display: inline-flex; }
  .card.locked canvas.preview { filter: saturate(.45) brightness(.82); }
  .card .cost small { font-size: 15px; color: var(--ink-soft); }
  .note { margin: 0; text-align: center; color: var(--paper-dark); font-size: 13px; flex: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="menu" class="screen on">
    <div class="poster">
      <div class="top">★ GRAND AERIAL EXHIBITION ★</div>
      <h1>Soaring<span>Plane</span></h1>
      <div class="rule">✠ ANNO MCMXVII ✠</div>
      <div class="sub">Brave the world · Outfly the storm</div>
    </div>
    <div class="menu-buttons">
      <button class="btn big" id="btnStart">Start</button>
      <button class="btn" id="btnStore">Store</button>
      <button class="btn" id="btnLang" disabled>Language<span class="soon">coming soon</span></button>
    </div>
    <div class="menu-stats">
      <b>Best: <span id="menuBest">0</span></b>
      <b><canvas class="coin-ic" width="44" height="44"></canvas><span id="menuCoins">0</span></b>
    </div>
  </div>

  <div id="over" class="screen">
    <div class="panel">
      <h2>Crashed!</h2>
      <div class="region" id="ovRegion"></div>
      <div class="line"><span>Score</span><b id="ovScore">0</b></div>
      <div class="line"><span>Best here</span><b id="ovBest">0</b></div>
      <div class="line"><span>Collected</span><b><canvas class="coin-ic" width="44" height="44"></canvas><span id="ovCoins">0</span></b></div>
      <div class="line"><span>Treasury</span><b><canvas class="coin-ic" width="44" height="44"></canvas><span id="ovTotal">0</span></b></div>
      <div class="newbest" id="ovNew"></div>
      <button class="btn big" id="btnRetry">Fly again</button>
      <div class="pair"><button class="btn" id="btnRegions">Regions</button><button class="btn" id="btnMenu">Menu</button></div>
    </div>
  </div>

  <div id="levels" class="screen">
    <div class="store-head">
      <button class="back" id="btnLevelBack">◄ Back</button>
      <h2>Regions</h2>
      <span class="wallet"><canvas class="coin-ic" width="44" height="44"></canvas><span id="levelCoins">0</span></span>
    </div>
    <div class="store-list" id="levelList"></div>
  </div>

  <div id="store" class="screen">
    <div class="store-head">
      <button class="back" id="btnBack">◄ Back</button>
      <h2>Store</h2>
      <span class="wallet"><canvas class="coin-ic" width="44" height="44"></canvas><span id="storeCoins">0</span></span>
    </div>
    <div class="tabs"><button id="tabPlanes">Planes</button><button id="tabBooms">Explosions</button></div>
    <div class="store-list" id="storeList"></div>
  </div>
  <button id="btnSound" aria-label="Music and sound">♪</button>
</div>

<script>
(() => {
'use strict';
// =====================================================================
//  SOARING PLANE — student project, non-commercial.
//  All aircraft, makers, stories and melodies are fictional / original.
//  Balance: coin in 70 % of gaps + 30 % bonus coins ≈ 1.0 coin per
//  obstacle; a coin pays 1-3 marks depending on the region.
// =====================================================================
const W = 480, H = 720;
const GROUND = H - 34;
const GRAVITY = 1500, FLAP_V = -430, MAX_FALL = 620;
const CLIFF_W = 92, SPACING = 270;
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);

function R(c, x, y, w, h, r, f) { c.fillStyle = f; c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); c.fill(); }
function PL(c, pts, f) { c.fillStyle = f; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill(); }
function LN(c, segs, col, w) { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); for (const [a, b, d, e] of segs) { c.moveTo(a, b); c.lineTo(d, e); } c.stroke(); }
function CI(c, x, y, r, f) { c.fillStyle = f; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
function wheel(c, x, y, r) { CI(c, x, y, r, '#1a1a1a'); CI(c, x, y, r * .4, '#7a7a7a'); }
function head(c, x, y) { CI(c, x, y, 3, '#5a3d25'); R(c, x - .5, y - 1.6, 3.6, 1.3, .6, '#1d1d1d'); }
function prop(c, x, y, len, t) {
  const s = Math.abs(Math.sin(t));
  c.fillStyle = 'rgba(90,90,90,.2)'; c.beginPath(); c.ellipse(x + 1.7, y, 2.4, len, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(78,50,24,.95)'; c.fillRect(x + .5, y - len * s, 2.5, len * 2 * s);
  R(c, x - 1, y - 1.6, 3.4, 3.2, 1.2, '#5a3d22');
}
function star(c, cx, cy, r, color) {
  c.fillStyle = color; c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .42 : r; c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  c.closePath(); c.fill();
}
function roundel(c, x, y, r, cols) { cols.forEach((col, i) => CI(c, x, y, r * (1 - i / cols.length), col)); }

// =====================================================================
//  COUNTRIES (label + the invented roundel used by its air service)
// =====================================================================
const RED = '#b8261d', WHT = '#f4f1e8', BLU = '#1f3d8f', GRN = '#2f7a45', BLK = '#151515', GLD = '#e9c33a';
const COUNTRIES = {
  uk: { name: 'United Kingdom', mark: [BLU, WHT, RED] },
  de: { name: 'German Empire', mark: [BLK, WHT, RED] },
  fr: { name: 'France', mark: [RED, WHT, BLU] },
  it: { name: 'Kingdom of Italy', mark: [RED, WHT, GRN] },
  us: { name: 'United States', mark: 'star' },
  ru: { name: 'Russian Empire', mark: [RED, BLU, WHT] },
  at: { name: 'Austria-Hungary', mark: [RED, WHT, GRN] },
  be: { name: 'Belgium', mark: [RED, GLD, BLK] },
  tr: { name: 'Ottoman Empire', mark: 'crescent' },
  bg: { name: 'Bulgaria', mark: [RED, GRN, WHT] },
  ca: { name: 'Canada', mark: 'leaf' },
  au: { name: 'Australia', mark: 'south' },
  pl: { name: 'Poland', mark: 'check' },
  gr: { name: 'Greece', mark: ['#2a5fb0', WHT, '#2a5fb0'] },
  nl: { name: 'Netherlands', mark: ['#e87a1d'] },
  jp: { name: 'Empire of Japan', mark: 'sun' },
};
function mark(c, k, x, y, r) {
  const m = COUNTRIES[k].mark;
  if (Array.isArray(m)) return roundel(c, x, y, r, m);
  if (m === 'star') { CI(c, x, y, r, BLU); star(c, x, y, r * .95, WHT); CI(c, x, y, r * .3, RED); }
  else if (m === 'crescent') { CI(c, x, y, r, RED); CI(c, x - r * .1, y, r * .55, WHT); CI(c, x + r * .12, y, r * .44, RED); }
  else if (m === 'leaf') { CI(c, x, y, r, WHT); star(c, x, y, r * .85, RED); R(c, x - r * .08, y + r * .2, r * .16, r * .6, 0, RED); }
  else if (m === 'south') { CI(c, x, y, r, BLU); star(c, x, y, r * .8, WHT); }
  else if (m === 'check') { R(c, x - r, y - r, r * 2, r * 2, .5, WHT); R(c, x - r, y - r, r, r, 0, RED); R(c, x, y, r, r, 0, RED); }
  else if (m === 'sun') { CI(c, x, y, r, WHT); CI(c, x, y, r * .78, '#c0272d'); }
}

// =====================================================================
//  AIRCRAFT RENDERER
//  Every aircraft in this game is FICTIONAL. One generic side-view
//  builder ("aero") is driven by a small recipe per plane.
//  Facing right, origin ≈ centre of the hitbox.
// =====================================================================
function tailPath(c, kind, T, FH) {
  c.beginPath();
  switch (kind) {
    case 'round': c.moveTo(T + 9, -3); c.quadraticCurveTo(T + 4, -FH - 3, T - 3, -FH + 1); c.quadraticCurveTo(T - 8, -FH + 5, T - 5, 1); break;
    case 'comma': c.moveTo(T + 4, -3); c.bezierCurveTo(T + 5, -FH - 3, T - 10, -FH - 1, T - 8, -FH * .4); c.quadraticCurveTo(T - 8, 1, T, 2); break;
    case 'shark': c.moveTo(T + 14, -4); c.quadraticCurveTo(T + 4, -6, T - 2, -FH - 2); c.lineTo(T - 7, -FH - 1); c.lineTo(T - 4, 2); break;
    case 'swallow': c.moveTo(T + 9, -3); c.lineTo(T - 5, -FH); c.lineTo(T - 10, -FH); c.lineTo(T - 4, -FH * .45); c.lineTo(T - 10, 1); c.lineTo(T, 1); break;
    default: c.moveTo(T + 8, -3); c.lineTo(T + 1, -FH); c.lineTo(T - 4, -FH); c.lineTo(T - 4, 1);
  }
  c.closePath();
}
function engineArt(c, type, N, o) {
  if (type === 'radial') {
    R(c, N - 2, -6.5, 7, 13, 2, '#3a3a3a'); for (let i = -4; i <= 4; i += 4) R(c, N - 1, i - 1, 5, 2, 1, '#6b6b6b');
  } else if (type === 'rotary') {
    R(c, N - 3, -7, 10, 14, 5, o.cowl || '#9a9a96'); R(c, N + 4, -5, 3, 10, 1.5, 'rgba(0,0,0,.45)'); R(c, N - 2, -6, 8, 2, 1, 'rgba(255,255,255,.3)');
  } else if (type === 'spinner') {
    c.fillStyle = o.cowl || '#8a8a86'; c.beginPath(); c.moveTo(N - 1, -6); c.quadraticCurveTo(N + 7, -4, N + 9, 0); c.quadraticCurveTo(N + 7, 4, N - 1, 6); c.fill();
    R(c, N - 13, -8.5, 10, 2.6, 1, '#4a4a4a'); LN(c, [[N - 8, -2, N - 16, 0]], '#2a2a2a', 1.7);
  } else if (type === 'ring') {
    R(c, N - 2, -7.5, 5, 15, 2.5, o.cowl || '#555'); R(c, N + 1.5, -5.5, 2, 11, 1, '#23262a'); for (let i = 0; i < 3; i++) LN(c, [[N - 9 + i * 2.2, -3, N - 9 + i * 2.2, 3]], 'rgba(0,0,0,.35)', .8);
  } else if (type === 'inline') {
    R(c, N - 14, -9, 11, 3.2, 1, '#454545'); for (let i = 0; i < 4; i++) R(c, N - 13 + i * 2.7, -10.5, 1.6, 2, .5, '#555');
    R(c, N, -6.5, 4.5, 13, 1, o.cowl || '#555'); LN(c, [[N + 1, -4, N + 3.5, -4], [N + 1, -1, N + 3.5, -1], [N + 1, 2, N + 3.5, 2]], '#2b2b2b', .7);
    LN(c, [[N - 10, -4, N - 18, -2]], '#2a2a2a', 1.6);
  }
}
function wingShape(c, [x, y, w, h], col, light, sweep) {
  if (sweep) PL(c, [[x + w, y], [x + w - 2, y + h], [x - sweep, y + h + 2.5], [x - sweep - 2, y + 2]], col);

PLANES.filter(p => p.id !== STARTER).sort((a, b) => (a.kmh + .35 * a.hp) - (b.kmh + .35 * b.hp)).forEach((p, i) => { p.cost = roundCost(40 + 1.6 * Math.pow(i + 1, 1.75)); });

//  UI

function refreshMoney() { for (const id of ['menuCoins', 'storeCoins', 'levelCoins', 'ovTotal']) $(id).textContent = save.coins; $('menuBest').textContent = save.best; $('btnSound').textContent = save.sound ? '♪' : '♪̸'; $('btnSound').classList.toggle('off', !save.sound); }
function toMenu() { save.region = REGION_BY_ID[save.region] ? save.region : 'cliffs'; reset(); G.state = 'menu'; refreshMoney(); show('menu'); Sound.play('menu'); }

function keepScroll(list, build) { const t = list.scrollTop; build(); list.scrollTop = t; }

  const bar = document.createElement('div'); bar.className = 'filter'; const chip = (key, label) => { const b = document.createElement('button'); b.title = label; b.setAttribute('aria-label', label); if (key === 'all') b.textContent = 'All'; else b.appendChild(flagCanvas(key, 27, 18)); b.classList.toggle('on', planeFilter === key); b.onclick = () => { planeFilter = key; buildPlanes(); $('storeList').scrollTop = 0; }; bar.appendChild(b); }; chip('all', 'All countries'); Object.entries(COUNTRIES).forEach(([k, v]) => chip(k, v.name)); list.appendChild(bar);

function openLevels() { buildLevels(); refreshMoney(); show('levels'); $('levelList').scrollTop = 0; const sel = $('levelList').querySelector('.selected'); if (sel) $('levelList').scrollTop = Math.max(0, sel.offsetTop - $('levelList').offsetTop - 10); }

$('btnStart').onclick = openLevels; $('btnStore').onclick = () => openStore('planes'); $('tabPlanes').onclick = () => openStore('planes'); $('tabBooms').onclick = () => openStore('booms');
