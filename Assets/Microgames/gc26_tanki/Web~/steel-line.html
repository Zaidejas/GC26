<!DOCTYPE html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стальной рубеж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: a vertical 9:16 3D field with a status strip on top and thumb controls below. Single dusk look by choice. */
:root {
  color-scheme: dark;
  --frame: min(100vw, 56.25vh);
  --u: calc(var(--frame) / 100);
  --night: #2B2235;
  --panel: rgba(26, 18, 36, .86);
  --strip: rgba(26, 18, 36, .72);
  --paper: #FFF2D9;
  --muted: #CBBBA8;
  --sand: #D9BC8C;
  --fire: #E8643A;
  --teal: #22B8A6;
  --mark: #35F2D0;
  --display: "Russo One", "Arial Black", Impact, sans-serif;
  --body: "Rubik", "Segoe UI", Roboto, Arial, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--paper); font-family: var(--body); overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* Everything lives in one 9:16 frame, centred on screens that are wider than that. */
#stage, #hud, #overlay, #toast { left: 50%; width: var(--frame); transform: translateX(-50%); }
#stage { position: fixed; top: 0; bottom: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
#hud { position: fixed; top: 0; box-sizing: border-box; z-index: 2; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; column-gap: calc(var(--u) * 2.5); row-gap: 2px; background: var(--strip); font-size: clamp(11px, calc(var(--u) * 3.4), 15px); font-weight: 600; font-variant-numeric: tabular-nums;
  padding: calc(env(safe-area-inset-top, 0px) + 5px) max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); }
#hud[hidden] { display: none !important; }
#pauseBtn { grid-column: 1; grid-row: 1 / 3; }
#levelName { grid-column: 2; grid-row: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--display); font-weight: 400; color: var(--sand); }
#stats { grid-column: 2 / 4; grid-row: 2; display: flex; gap: calc(var(--u) * 4); }
#hearts { grid-column: 3; grid-row: 1; display: flex; align-items: center; gap: 3px; }
#hearts svg { width: clamp(16px, calc(var(--u) * 5.4), 26px); height: auto; display: block; }
#hearts b { font-size: 1.1em; color: var(--paper); margin-left: 2px; }
.stat { white-space: nowrap; }
.stat b { font-weight: 600; color: var(--paper); }
.stat { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
#pauseBtn { flex: none; width: 34px; height: 30px; border: 1px solid rgba(255,242,217,.35); border-radius: 6px; background: transparent; font-weight: 600; }
/* Thumb controls: always on screen, drawn for touch. Touches pass through to #stage. */
#stick, #fire { position: fixed; z-index: 1; border-radius: 50%; pointer-events: none; box-sizing: border-box; }
#stick { left: calc(50vw - var(--frame) / 2 + var(--u) * 4); bottom: calc(var(--u) * 2.5 + env(safe-area-inset-bottom, 0px)); width: calc(var(--u) * 33); height: calc(var(--u) * 33); background: rgba(26, 18, 36, .55); border: 2px solid rgba(255, 242, 217, .4); }
#knob { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 14); height: calc(var(--u) * 14); margin: calc(var(--u) * -7) 0 0 calc(var(--u) * -7); border-radius: 50%; background: var(--paper); opacity: .78; }
.arrow { position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: calc(var(--u) * -2.2) 0 0 calc(var(--u) * -2.2); border-left: calc(var(--u) * 2.2) solid transparent; border-right: calc(var(--u) * 2.2) solid transparent; border-bottom: calc(var(--u) * 4.4) solid rgba(255, 242, 217, .55); }
.arrow[data-d="0"] { transform: translateY(calc(var(--u) * -12.5)); }
.arrow[data-d="1"] { transform: translateX(calc(var(--u) * 12.5)) rotate(90deg); }
.arrow[data-d="2"] { transform: translateY(calc(var(--u) * 12.5)) rotate(180deg); }
.arrow[data-d="3"] { transform: translateX(calc(var(--u) * -12.5)) rotate(270deg); }
.arrow.on { border-bottom-color: var(--mark); }
#fire { right: calc(50vw - var(--frame) / 2 + var(--u) * 5); bottom: calc(var(--u) * 5 + env(safe-area-inset-bottom, 0px)); width: calc(var(--u) * 28); height: calc(var(--u) * 28); background: var(--fire); opacity: .82; border: 3px solid rgba(255, 242, 217, .55); display: grid; place-items: center; font-family: var(--display); font-size: calc(var(--u) * 4.2); }
#fire.on { opacity: 1; transform: scale(.93); }
/* The reactor strike: low between the stick and the fire button, a ring that fills with kills. */
#super { position: fixed; z-index: 1; pointer-events: none; left: 50vw; bottom: calc(var(--u) * 3 + env(safe-area-inset-bottom, 0px)); width: calc(var(--u) * 17); height: calc(var(--u) * 17); margin-left: calc(var(--u) * -8.5); border-radius: 50%;
  background: conic-gradient(var(--mark) calc(var(--charge, 0) * 1%), rgba(255, 242, 217, .16) 0); display: grid; place-items: center; }
#super span { width: 80%; height: 80%; border-radius: 50%; background: rgba(26, 18, 36, .82); display: grid; place-items: center; font-family: var(--display); font-size: calc(var(--u) * 3.3); color: rgba(255, 242, 217, .7); }
#super.ready span { background: var(--mark); color: #1A1224; }
#super.ready { animation: super-pulse .9s ease-in-out infinite; }
@keyframes super-pulse { 50% { transform: scale(1.07); } }
#bossBar { position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); width: calc(var(--frame) * .76); top: calc(env(safe-area-inset-top, 0px) + var(--u) * 13); text-align: center; font-weight: 600; font-size: clamp(11px, calc(var(--u) * 3.2), 14px); pointer-events: none; }
#bossBar div { height: 10px; margin-top: 3px; padding: 2px; background: rgba(21, 16, 28, .9); border-radius: 2px; }
#bossBar b { display: block; height: 100%; width: 100%; background: #FF5447; }
.actions.column { flex-direction: column; align-items: stretch; width: min(100%, 300px); }
/* Level select: numbered steel tags. Boss levels are red, the newest open level glows. */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; }
.grid button { position: relative; min-height: 60px; border: 0; color: var(--paper); font-family: var(--display); font-size: clamp(18px, calc(var(--u) * 5.6), 24px); line-height: 1.05;
  background: linear-gradient(#5A5064, #3A3046); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); box-shadow: inset 0 2px 0 rgba(255, 242, 217, .18), inset 0 -3px 0 rgba(0, 0, 0, .35); }
.grid button small { display: block; margin-top: 2px; font: 600 clamp(9px, calc(var(--u) * 2.6), 11px)/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: #FFD2C8; }
.grid button.boss { background: linear-gradient(#B8432F, #74241A); }
.grid button.next { background: linear-gradient(#2FD3BC, #168C80); color: #0E1A1C; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .4), 0 0 0 2px var(--mark); animation: next-glow 1.4s ease-in-out infinite; }
.grid button.next small { color: #0E2A28; }
@keyframes next-glow { 50% { filter: brightness(1.15); } }
.grid button:disabled { background: rgba(30, 24, 38, .85); color: rgba(255, 242, 217, .3); cursor: default; box-shadow: inset 0 0 0 1px rgba(255, 242, 217, .1); }
.grid button:disabled svg { width: 18px; height: 18px; }
.levelName { min-height: 1.4em; font-weight: 600; color: var(--sand) !important; }
/* Workshop rows. */
.shop { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.shop > div { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 3px 12px; padding: 10px 12px; background: rgba(255, 242, 217, .06); box-shadow: inset 0 0 0 1px rgba(255, 242, 217, .08); text-align: left;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.shop .icon { grid-row: 1 / 4; width: 42px; height: 42px; display: grid; place-items: center; background: rgba(53, 242, 208, .12); box-shadow: inset 0 0 0 1px rgba(53, 242, 208, .4); color: var(--mark); }
.shop .icon svg { width: 26px; height: 26px; }
.shop strong { font-family: var(--display); font-weight: 400; font-size: clamp(14px, calc(var(--u) * 4.2), 18px); letter-spacing: .02em; }
.shop p { grid-column: 2; font-size: clamp(11px, calc(var(--u) * 3.2), 13px) !important; color: var(--muted) !important; text-shadow: none !important; }
.pips { grid-column: 2; display: flex; gap: 4px; }
.pips i { width: 22px; height: 7px; background: rgba(255, 255, 255, .16); transform: skewX(-20deg); }
.pips i.on { background: var(--mark); box-shadow: 0 0 6px rgba(53, 242, 208, .7); }
.shop button { grid-column: 3; grid-row: 1 / 4; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 88px; min-height: 52px; padding: 4px 10px; border: 0; color: #fff; font-family: var(--display); font-size: clamp(13px, calc(var(--u) * 3.8), 16px);
  background: linear-gradient(#F27A4C, #C24A24); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); box-shadow: inset 0 2px 0 rgba(255, 220, 190, .4), inset 0 -3px 0 rgba(90, 26, 8, .5); }
.shop button span { display: inline-flex; align-items: center; gap: 4px; font: 600 12px/1 var(--body); color: #FFE6D2; }
.shop button span svg { width: 13px; height: 13px; }
.shop button:disabled { background: rgba(255, 242, 217, .1); box-shadow: none; color: var(--muted); cursor: default; }
.shop button:disabled span { color: var(--muted); }
/* Survival choices. */
.choices { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.choices button { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 12px; padding: 12px 14px; border: 0; color: var(--paper); text-align: left;
  background: linear-gradient(90deg, rgba(53, 242, 208, .16), rgba(30, 22, 38, .9) 60%); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); box-shadow: inset 0 0 0 2px rgba(53, 242, 208, .5); transition: transform .08s; }
.choices button:hover { filter: brightness(1.12); }
.choices button:active { transform: scale(.98); }
.choices button .icon { grid-row: 1 / 3; width: 40px; height: 40px; display: grid; place-items: center; color: var(--mark); }
.choices button .icon svg { width: 30px; height: 30px; }
.choices button strong { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(15px, calc(var(--u) * 4.4), 19px); }
.choices button span { font-size: clamp(12px, calc(var(--u) * 3.4), 14px); color: var(--muted); }
/* Result screens: a big ribbon over the plate. */
.result { display: flex; gap: 8px; width: 100%; }
.result div { flex: 1 1 0; padding: 8px 4px; background: rgba(255, 242, 217, .06); box-shadow: inset 0 0 0 1px rgba(255, 242, 217, .1); }
.result b { display: block; font: 400 clamp(18px, calc(var(--u) * 5.6), 24px)/1.1 var(--display); color: var(--paper); font-variant-numeric: tabular-nums; }
.result span { font-size: clamp(10px, calc(var(--u) * 3), 12px); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
#card.win h1 { color: #FFE7A8; }
#card.lose h1 { color: #FF8A78; }
#toast { position: fixed; z-index: 2; top: 13vh; text-align: center; font-weight: 600; font-size: clamp(13px, calc(var(--u) * 4), 20px); text-shadow: 0 1px 4px #000; pointer-events: none; opacity: 0; transition: opacity .2s; }
#toast.on { opacity: 1; }
/* Menus sit on a painted picture, not on the live map. The picture drifts slowly; the panel keeps text readable. */
#overlay { position: fixed; top: 0; bottom: 0; box-sizing: border-box; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #16101C; overflow-x: hidden; overflow-y: auto; padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 14px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); forced-color-adjust: none; }
#art { position: fixed; top: 0; bottom: 0; left: 50%; width: var(--frame); transform: translateX(-50%); overflow: hidden; pointer-events: none; }
#art i { position: absolute; inset: -4%; background: #16101C center / cover no-repeat; image-rendering: pixelated; opacity: 0; transition: opacity .35s; animation: art-drift 24s ease-in-out infinite alternate; }
#art i.on { opacity: 1; }
#art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(14, 10, 20, .5), rgba(14, 10, 20, 0) 30%, rgba(14, 10, 20, 0) 62%, rgba(14, 10, 20, .6)); }
@keyframes art-drift { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.06) translate(-1.5%, -1.2%); } }
@media (prefers-reduced-motion: reduce) { #art i { animation: none; } }
#card { position: relative; width: 100%; max-width: 420px; margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, calc(var(--u) * 3), 14px); }
#card h1 { margin: 0; font: 400 clamp(26px, calc(var(--u) * 9), 46px)/1.05 var(--display); letter-spacing: .03em; color: var(--paper); text-shadow: 0 3px 0 #2A1C14, 0 0 18px rgba(0, 0, 0, .6); text-wrap: balance; text-transform: uppercase; }
#card p { margin: 0; line-height: 1.4; font-size: clamp(13px, calc(var(--u) * 3.8), 16px); color: var(--paper); max-width: 46ch; text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }
/* The plate behind buttons and lists: dark, with cut corners and a thin brass edge. */
.plate { position: relative; width: 100%; box-sizing: border-box; padding: clamp(12px, calc(var(--u) * 4), 18px); display: flex; flex-direction: column; align-items: center; gap: clamp(8px, calc(var(--u) * 2.6), 12px);
  background: linear-gradient(rgba(30, 22, 38, .84), rgba(18, 13, 24, .9)); clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
  box-shadow: inset 0 0 0 1px rgba(217, 188, 140, .28), inset 0 1px 0 rgba(255, 242, 217, .12); backdrop-filter: blur(2px); }
.plate::before, .plate::after { content: ""; position: absolute; width: 6px; height: 6px; top: 7px; background: rgba(217, 188, 140, .45); border-radius: 50%; }
.plate::before { left: 7px; } .plate::after { right: 7px; }
/* Logo on the title screen. */
.logo { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: clamp(6px, calc(var(--u) * 4), 26px); }
.logo small { font: 400 clamp(11px, calc(var(--u) * 3.3), 14px)/1 var(--body); font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--mark); text-shadow: 0 0 10px rgba(53, 242, 208, .6); }
.logo b { display: block; font: 400 clamp(40px, calc(var(--u) * 15), 74px)/.92 var(--display); letter-spacing: .02em; text-transform: uppercase;
  background: linear-gradient(#FFF6E4 10%, #D9BC8C 52%, #9C7448 54%, #E8C891 90%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #2A1C14) drop-shadow(0 0 22px rgba(0, 0, 0, .7)); }
.logo i { display: block; width: 72%; height: 3px; margin-top: 8px; background: linear-gradient(90deg, transparent, var(--mark), transparent); box-shadow: 0 0 12px var(--mark); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 8px; background: rgba(14, 10, 20, .78); box-shadow: inset 0 0 0 1px rgba(217, 188, 140, .3); border-radius: 999px; font-weight: 600; font-size: clamp(12px, calc(var(--u) * 3.5), 15px); font-variant-numeric: tabular-nums; color: var(--paper); }
.chip svg { width: 1.15em; height: 1.15em; flex: none; }
.chip span { color: var(--muted); font-weight: 400; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.actions button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 11px 26px; min-height: 48px; border: 0; color: #fff; font-family: var(--display); font-size: clamp(15px, calc(var(--u) * 4.5), 20px); letter-spacing: .03em; text-transform: uppercase;
  background: linear-gradient(#F27A4C, #D4532B 55%, #B8431F); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  box-shadow: inset 0 2px 0 rgba(255, 220, 190, .45), inset 0 -4px 0 rgba(90, 26, 8, .55); text-shadow: 0 2px 0 rgba(90, 26, 8, .6); transition: transform .08s, filter .15s; }
.actions button:hover { filter: brightness(1.1); }
.actions button:active { transform: translateY(2px); filter: brightness(.95); }
.actions button svg { width: 1.1em; height: 1.1em; flex: none; }
.actions button.quiet { background: linear-gradient(rgba(70, 58, 84, .9), rgba(44, 34, 56, .9)); box-shadow: inset 0 0 0 2px rgba(217, 188, 140, .4), inset 0 2px 0 rgba(255, 242, 217, .12); text-shadow: none; color: var(--paper); }
.actions.column button { justify-content: flex-start; padding-left: 18px; }
.actions.column button svg { color: var(--sand); }
.actions.column button:first-child svg { color: #fff; }
#splash { forced-color-adjust: none; position: fixed; top: 0; bottom: 0; left: 50%; width: var(--frame); transform: translateX(-50%); z-index: 3; pointer-events: none; overflow: hidden; }
#splash h1 { position: absolute; left: 0; right: 0; top: 11%; margin: 0; text-align: center; font: 400 clamp(26px, calc(var(--u) * 10.5), 54px)/1.05 var(--display); letter-spacing: .02em; color: var(--sand); text-shadow: 0 3px 0 #5A3D2B; }
#splash.hit h1 { animation: splash-hit .4s ease-out .22s; }
@keyframes splash-hit { 0% { transform: translateY(0) scale(1); } 25% { transform: translateY(-8px) scale(1.09) rotate(-1.5deg); color: var(--paper); } 55% { transform: translateY(3px) scale(.98) rotate(1deg); } 100% { transform: none; } }
#splashBottom { position: absolute; left: 9%; right: 9%; bottom: 11%; }
#splashLabel { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; font-variant-numeric: tabular-nums; font-size: clamp(13px, calc(var(--u) * 3.8), 17px); color: var(--paper); }
#splashBar { display: flex; gap: 5px; height: calc(var(--u) * 3.6); padding: 4px; background: #15101C; border-radius: 3px; }
#splashBar i { flex: 1 1 0; background: #4A4552; display: block; }
#splashBar b { display: block; height: 100%; width: 0; background: var(--mark); }
#splashFlash { position: absolute; inset: 0; background: #FFF6DE; opacity: 0; }
#levels { display: flex; gap: 6px; width: 100%; }
#levels button { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 8px 2px; border: 0; border-radius: 4px; background: rgba(255,242,217,.12); color: var(--paper); font-weight: 600; font-size: clamp(12px, calc(var(--u) * 3.7), 15px); }

#legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; font-size: clamp(11px, calc(var(--u) * 3.2), 13px); text-align: left; color: var(--muted); width: 100%; }
#legend span { display: flex; align-items: center; gap: 6px; min-width: 0; }
#legend i { flex: none; width: 11px; height: 11px; border-radius: 2px; }
/* Stars under level numbers and on result screens. */
.stars { display: block; margin-top: 3px; font: 400 11px/1 var(--body); letter-spacing: 1px; color: rgba(255, 242, 217, .25); }
.stars b { color: #FFD34D; font-weight: 400; text-shadow: 0 0 6px rgba(255, 211, 77, .6); }
.bigStars { font: 400 clamp(30px, calc(var(--u) * 10), 44px)/1 var(--display); letter-spacing: 6px; color: rgba(255, 242, 217, .2); }
.bigStars b { color: #FFD34D; font-weight: 400; text-shadow: 0 0 14px rgba(255, 211, 77, .8); }
.grid.six { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.six button { min-height: 78px; font-size: clamp(14px, calc(var(--u) * 4.2), 18px); }
.grid button.assault { background: linear-gradient(#7A3B33, #4A2420); }
/* Garage: one card per tank with its drawing. */
.garage { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.garage > div { display: grid; grid-template-columns: 64px 1fr auto; gap: 2px 12px; align-items: center; padding: 8px 10px; text-align: left; background: rgba(255, 242, 217, .06); box-shadow: inset 0 0 0 1px rgba(255, 242, 217, .08);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.garage > div.chosen { background: rgba(53, 242, 208, .12); box-shadow: inset 0 0 0 2px rgba(53, 242, 208, .6); }
.garage img { grid-row: 1 / 4; width: 64px; height: 64px; image-rendering: pixelated; object-fit: contain; transform: scale(1.35); }
.garage strong { font-family: var(--display); font-weight: 400; font-size: clamp(15px, calc(var(--u) * 4.4), 19px); }
.garage p { grid-column: 2; font-size: clamp(11px, calc(var(--u) * 3.1), 13px) !important; color: var(--muted) !important; text-shadow: none !important; }
.garage p.power { color: var(--mark) !important; }
.garage button { grid-column: 3; grid-row: 1 / 4; min-width: 88px; min-height: 48px; padding: 4px 10px; border: 0; color: #fff; font-family: var(--display); font-size: clamp(12px, calc(var(--u) * 3.6), 15px);

  const s = { tiles: [], hp: [], enemies: [], bullets: [], mines: [], turrets: [], events: [], fortCells: [], spawns: [], score: 0, lives: TUNE.lives, level: 0, phase: "playing", freeze: 0, fort: 0, bonus: null, nextId: 1,
    mode: "campaign", stats: [0, 0, 0, 0], star: 0, starTimer: 0, charge: 0, need: superNeed(0), parts: 0, wave: 0, choices: [], superCut: 0,
    tank: "guard", cloak: 0, time: 0, livesLost: 0, coreHp: 0, coreMax: 0, turretCount: 0, starsWon: 0 };
  const emit = (kind, x, y, extra) => s.events.push(Object.assign({ kind, x, y }, extra));
  const tankDef = () => TANKS[s.tank] || TANKS.guard;
  const clamp01 = v => Math.max(0, Math.min(1, v));

  s.left = () => s.mode === "assault" ? s.coreHp : (s.waves.length - s.cursor) + s.enemies.length;
  s.settings = DIFFICULTY.Normal;
  s.setDifficulty = name => { s.settings = DIFFICULTY[name]; };

  // The chosen tank changes the workshop's numbers a little and picks the ability.
  s.maxHp = () => Math.max(1, TUNE.baseHp + s.stats[0] + tankDef().hp);
  s.driveSpeed = () => TUNE.driveSpeed[s.stats[3]] + tankDef().speed;
  s.cooldown = () => TUNE.fireCooldown[s.stats[2]] * tankDef().cool;
  s.ability = () => tankDef().ability;
  const needFor = base => Math.max(2, base + tankDef().need);
  s.superReady = () => s.charge >= s.need;
  s.boss = () => s.enemies.find(e => e.kind === "X") || null;
  s.isBossLevel = () => s.mode === "survival" ? s.wave % TUNE.bossEvery === 0 : s.waves.includes("X");
  s.baseMax = () => s.mode === "survival" ? TUNE.survivalBaseHp : 1;
  s.levelName = () => s.mode === "survival" ? "Выживание, волна " + s.wave
    : s.mode === "assault" ? "Штурм " + (s.level + 1) + ". " + ASSAULT[s.level].name : (s.level + 1) + ". " + LEVELS[s.level].name;
  s.mapCount = () => s.mode === "assault" ? ASSAULT.length : LEVELS.length;
  s.bulletSpeed = () => TUNE.gunSpeed[s.stats[1]] + (s.star >= 1 ? TUNE.starBoost : 0);
  s.maxBullets = () => TUNE.fireBullets[s.stats[2]] + (s.star >= 2 ? 1 : 0);
  // Stars: one for the win, one for losing no tank on this map, one for beating the par time.
  s.par = () => s.mode === "assault" ? 60 + s.turretCount * 12 : 40 + s.waves.length * 7;
  s.stars = () => 1 + (s.livesLost === 0 ? 1 : 0) + (s.time <= s.par() ? 1 : 0);
  const visible = () => s.player.alive && s.cloak <= 0;

  s.load = function (index) {
    s.level = index;
    if (s.mode === "assault") {
      s.smart = clamp01(.35 + .1 * index + s.settings.smartBonus);
      loadMap(ASSAULT[index].rows, ASSAULT[index].waves);
      s.need = needFor(TUNE.assaultSuperNeed);
      s.coreHp = s.coreMax = coreHp(index);
      return;
    }
    s.smart = clamp01(LEVEL_SMARTNESS[index] + s.settings.smartBonus);
    loadMap(LEVELS[index].rows, LEVELS[index].waves);
    s.need = needFor(superNeed(index));
  };
  // A campaign run from the chosen level, with the workshop's upgrades.
  s.startCampaign = function (index, stats, tank) {
    Object.assign(s, { mode: "campaign", stats: stats.slice(), tank: tank || "guard", score: 0, lives: TUNE.lives, parts: 0 });
    s.load(index);
  };
  // Assault: no reactor to keep, the enemy's one to break.
  s.startAssault = function (index, stats, tank) {
    Object.assign(s, { mode: "assault", stats: stats.slice(), tank: tank || "guard", score: 0, lives: TUNE.lives, parts: 0 });
    s.load(index);
  };
  // Endless waves on the arena, with a choice of upgrade after each one.
  s.startSurvival = function (stats, tank) {
    Object.assign(s, { mode: "survival", stats: stats.slice(), tank: tank || "guard", score: 0, lives: TUNE.lives, parts: 0, superCut: 0, wave: 1, level: 0 });
    s.smart = survivalSmart(1);
    loadMap(SURVIVAL.rows, survivalWave(1));
    s.need = needFor(TUNE.survivalSuperNeed);
    s.baseHp = s.baseMax();
  };
  s.takeParts = () => { const parts = s.parts; s.parts = 0; return parts; };
  const survivalSmart = wave => clamp01(.2 + .05 * wave + s.settings.smartBonus);
  // More and tougher enemies each wave, the new kinds from wave 3, a boss every fifth one.
  function survivalWave(wave) {
    let list = "";
    const heavy = Math.min(.4, .05 * wave);
    for (let i = 0; i < 5 + wave; i++) {
      const roll = Math.random();
      list += roll < heavy ? "H" : roll < heavy + .2 ? "G" : roll < heavy + .4 ? "S"
        : wave >= 3 && roll < heavy + .5 ? "M" : wave >= 4 && roll < heavy + .58 ? "F" : wave >= 5 && roll < heavy + .66 ? "K" : "R";
    }
    return wave % TUNE.bossEvery === 0 ? list + "X" : list;
  }
  s.chooseUpgrade = function (upgrade) {
    if (s.phase !== "choice") return;
    const p = s.player, stat = RUN_UPGRADES.indexOf(upgrade);
    if (stat >= 0 && stat < 4) {
      s.stats[stat] = Math.min(TUNE.survivalMax, s.stats[stat] + 1);
      if (p.alive) {
        p.speed = s.driveSpeed();
        if (stat === 0) { p.maxHp = s.maxHp(); p.hp = Math.min(p.maxHp, p.hp + 1); }
      }
    } else if (upgrade === "repair") { s.lives++; if (p.alive) p.hp = p.maxHp; s.baseHp = s.baseMax(); }
    else if (upgrade === "super") { s.superCut = Math.min(s.superCut + 1, TUNE.survivalSuperNeed - 3); s.charge += 2; }
    else if (upgrade === "fort") startFort(30);
    s.need = needFor(TUNE.survivalSuperNeed - s.superCut);
    s.wave++;
    s.smart = survivalSmart(s.wave);
    Object.assign(s, { waves: survivalWave(s.wave), cursor: 0, spawnTimer: 1.5, clearTimer: 0, choices: [], phase: "playing" });
  };
  function offerChoices() {
    const pool = RUN_UPGRADES.filter((u, i) => (i >= 4 || s.stats[i] < TUNE.survivalMax) && (u !== "super" || s.superCut < TUNE.survivalSuperNeed - 3));
    s.choices = [];
    while (s.choices.length < 3 && pool.length) s.choices.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  // For checks: fill the ability's charge, and fire it as the button would.
  s.fillSuper = () => { while (!s.superReady()) addCharge(); };
  s.useSuper = () => { if (s.phase === "playing" && s.player.alive && s.superReady()) useAbility(); };

  function loadMap(rows, waves) {
    s.baseRoutesStale = s.playerRouteStale = true;
    Object.assign(s, { enemies: [], bullets: [], mines: [], turrets: [], events: [], fortCells: [], spawns: [], bonus: null, phase: "playing", freeze: 0, fort: 0, waves, cursor: 0, looped: false, spawnerIndex: 0, spawnTimer: .5, clearTimer: 0, respawnTimer: 0,
      star: 0, starTimer: 0, charge: 0, choices: [], cloak: 0, time: 0, livesLost: 0, starsWon: 0, baseHp: s.baseMax() });
    s.tiles = []; s.hp = [];
    for (let x = 0; x < W; x++) { s.tiles.push(new Array(H).fill(0)); s.hp.push(new Array(H).fill(0)); }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const c = rows[y][x];
      let t = T.Empty;
      if (c === "#") t = T.Crate; else if (c === "@") t = T.Concrete; else if (c === "%") t = T.Net;
      else if (c === "~") t = T.Water; else if (c === "=") t = T.Oil;
      else if (c === "B") { t = T.Base; s.baseX = x; s.baseY = y; }
      else if (c === "C") { t = T.Core; s.baseX = x; s.baseY = y; }
      else if (c === "T") { t = T.Turret; s.turrets.push({ id: -(s.nextId++), x, y, hp: TUNE.turretHp, dir: Down, fireIn: rnd(.8, 1.6) }); }
      else if (c === "P") { s.spawnX = x; s.spawnY = y; }
      else if (c === "E") s.spawns.push([x, y]);
      s.tiles[x][y] = t;
      s.hp[x][y] = t === T.Crate ? TUNE.crateHp : 0;
    }
    s.turretCount = s.turrets.length;
    spawnPlayer();
  }
  s.newGame = function () { s.startCampaign(0, s.stats, s.tank); };
  s.next = function () { if (s.level + 1 < s.mapCount()) s.load(s.level + 1); };

  function spawnPlayer() {
    s.player = { id: s.nextId++, isPlayer: true, kind: "P", x: s.spawnX + .5, y: s.spawnY + .5, dir: Up, speed: s.driveSpeed(), hp: s.maxHp(), maxHp: s.maxHp(), hurt: 0, alive: true, moving: false, shield: TUNE.respawnShield, spawn: 0, cool: 0, slide: 0, carrier: false };
  }

  function blocksTank(t, o, x, y) {
    const size = TUNE.half * 2;
    if (Math.abs(o.x - x) >= size || Math.abs(o.y - y) >= size) return false;
    const before = (o.x - t.x) ** 2 + (o.y - t.y) ** 2, after = (o.x - x) ** 2 + (o.y - y) ** 2;
    return after <= before;
  }
  function canOccupy(t, x, y) {
    const h = TUNE.half;
    const x0 = Math.floor(x - h), x1 = Math.floor(x + h), y0 = Math.floor(y - h), y1 = Math.floor(y + h);
    if (x0 < 0 || y0 < 0 || x1 >= W || y1 >= H) return false;
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) if (solid(s.tiles[cx][cy])) return false;
    if (t !== s.player && s.player.alive && blocksTank(t, s.player, x, y)) return false;
    for (const o of s.enemies) if (o !== t && o.alive && blocksTank(t, o, x, y)) return false;
    return true;
  }
  function anyTankAt(x, y) {
    const size = TUNE.half * 2;
    if (s.player.alive && Math.abs(s.player.x - x) < size && Math.abs(s.player.y - y) < size) return true;
    return s.enemies.some(e => e.alive && Math.abs(e.x - x) < size && Math.abs(e.y - y) < size);
  }
  function moveForward(t, step) {
    for (let i = 0; i < 5; i++) {
      const x = t.x + DX[t.dir] * step, y = t.y + DY[t.dir] * step;
      if (canOccupy(t, x, y)) { t.x = x; t.y = y; return true; }
      step *= .5;
    }
    return false;
  }
  // Keeps a moving tank going until it reaches the junction the turn leads into.
  function shouldTurnNow(t, want) {
    const along = (t.dir === Left || t.dir === Right) ? t.x : t.y;
    const offset = Math.abs(along - (Math.floor(along) + .5));
    const cx = Math.floor(t.x) + DX[want], cy = Math.floor(t.y) + DY[want];
    const open = inBounds(cx, cy) && !solid(s.tiles[cx][cy]);
    if (!t.moving) return true;
    if (open && offset <= TUNE.turnWindow) return true;
    return !canOccupy(t, t.x + DX[t.dir] * .05, t.y + DY[t.dir] * .05);
  }
  function drive(t, want, dt) {
    if (want === null || want === undefined) {
      const cx = Math.floor(t.x), cy = Math.floor(t.y);
      if (t.moving && inBounds(cx, cy) && s.tiles[cx][cy] === T.Oil && t.slide > 0) { t.slide -= dt; t.moving = moveForward(t, t.speed * dt); }
      else t.moving = false;
      return;
    }
    t.slide = TUNE.oilSlide;
    if (want !== t.dir) {
      const perp = ((want + t.dir) & 1) === 1;
      if (!perp) t.dir = want;
      else if (shouldTurnNow(t, want) && snapTurn(t)) t.dir = want;
    }
    t.moving = moveForward(t, t.speed * dt);
  }
  // Before a quarter turn the tank lines up with the row or column it is leaving.
  function snapTurn(t) {
    let x = t.x, y = t.y;
    if (t.dir === Left || t.dir === Right) x = Math.floor(x) + .5; else y = Math.floor(y) + .5;
    if (!canOccupy(t, x, y)) return false;
    t.x = x; t.y = y;
    return true;
  }
  const bulletsOf = t => s.bullets.reduce((n, b) => n + (b.owner === t.id && !b.volley ? 1 : 0), 0);
  function fire(t, speed, pierce, damage) {
    s.bullets.push({ owner: t.id, fromPlayer: !!t.isPlayer, pierce, damage: damage || 1, x: t.x + DX[t.dir] * .5, y: t.y + DY[t.dir] * .5, dir: t.dir, speed, alive: true });
    emit("shot", t.x, t.y, { isPlayer: !!t.isPlayer });
  }

  function updatePlayer(dt, input) {
    const p = s.player;
    if (!p.alive) {
      s.respawnTimer -= dt;
      if (s.respawnTimer <= 0 && !anyTankAt(s.spawnX + .5, s.spawnY + .5)) spawnPlayer();
      return;
    }
    p.shield = Math.max(0, p.shield - dt);
    p.hurt = Math.max(0, p.hurt - dt);
    p.cool = Math.max(0, p.cool - dt);
    drive(p, input.move, dt);
    if (input.super && s.superReady()) useAbility();
    if (input.fire && p.cool <= 0 && bulletsOf(p) < s.maxBullets()) {
      fire(p, s.bulletSpeed(), s.star >= 3, TUNE.gunDamage[s.stats[1]]);
      p.cool = s.cooldown();
    }
  }
  function hurtPlayer() {
    const p = s.player;
    if (p.shield > 0 || p.hurt > 0) { emit("spark", p.x, p.y); return; }
    p.hp--;
    if (p.hp <= 0) { killPlayer(); return; }
    p.hurt = TUNE.hurt;
    emit("playerHit", p.x, p.y);
  }

  // ---- Abilities: one per tank, charged by kills ----
  function useAbility() {
    s.charge = 0;
    const a = s.ability();
    if (a === "volley") volley();
    else if (a === "dome") dome();
    else if (a === "dash") dash();
    else superStrike();
  }
  // Guard: a wide beam along the barrel that hurts everything in it and clears crates on its line.
  function superStrike() {
    const p = s.player, dir = p.dir, horizontal = dir === Left || dir === Right;
    emit("super", p.x, p.y, { dir, ability: "strike" });
    const inBeam = (x, y) => (horizontal ? Math.abs(y - p.y) : Math.abs(x - p.x)) <= TUNE.superHalf && (horizontal ? (x - p.x) * DX[dir] : (y - p.y) * DY[dir]) > 0;
    for (const e of s.enemies) if (e.alive && e.spawn <= 0 && inBeam(e.x, e.y)) damageEnemy(e, TUNE.superDamage, false);
    for (const b of s.bullets) if (!b.fromPlayer && inBeam(b.x, b.y)) b.alive = false;
    for (const m of s.mines) if (inBeam(m.x, m.y)) { m.gone = true; emit("mineShot", m.x, m.y); }
    s.mines = s.mines.filter(m => !m.gone);
    let x = Math.floor(p.x), y = Math.floor(p.y);
    for (;;) {
      x += DX[dir]; y += DY[dir];
      if (!inBounds(x, y)) break;
      const t = s.tiles[x][y];
      if (t === T.Crate) { s.tiles[x][y] = T.Empty; s.hp[x][y] = 0; s.baseRoutesStale = true; emit("tile", x, y, { debris: true }); }
      else if (t === T.Turret) damageTurret(turretAt(x, y), TUNE.superDamage);
      else if (t === T.Core) damageCore(TUNE.superDamage, x, y);
    }
    s.bullets = s.bullets.filter(b => b.alive);
    s.enemies = s.enemies.filter(e => e.alive);
  }
  // Squall: two piercing shells each way.
  function volley() {
    const p = s.player;
    emit("super", p.x, p.y, { dir: p.dir, ability: "volley" });
    for (let d = 0; d < 4; d++) for (const side of [-.22, .22]) {
      const ox = d === Up || d === Down ? side : 0, oy = d === Up || d === Down ? 0 : side;
      s.bullets.push({ owner: p.id, fromPlayer: true, pierce: true, volley: true, damage: TUNE.volleyDamage, x: p.x + DX[d] * .5 + ox, y: p.y + DY[d] * .5 + oy, dir: d, speed: s.bulletSpeed() + 2, alive: true });
    }
  }
  // Bastion: a shield, and the tanks close by stand still for a while.
  function dome() {
    const p = s.player;
    p.shield = Math.max(p.shield, TUNE.domeShield);
    emit("super", p.x, p.y, { dir: p.dir, ability: "dome" });
    for (const e of s.enemies) if (e.alive && Math.hypot(e.x - p.x, e.y - p.y) <= TUNE.domeRange) { e.stun = TUNE.domeStun; e.moving = false; }
    for (const b of s.bullets) if (!b.fromPlayer && Math.hypot(b.x - p.x, b.y - p.y) <= TUNE.domeRange) b.alive = false;
    s.bullets = s.bullets.filter(b => b.alive);
  }
  // Phantom: jumps ahead until something blocks it, then the enemy loses sight of it.
  function dash() {
    const p = s.player, fromX = p.x, fromY = p.y;
    for (let moved = 0; moved < TUNE.dashCells; moved += .1) {
      const x = p.x + DX[p.dir] * .1, y = p.y + DY[p.dir] * .1;
      if (!canOccupy(p, x, y)) break;
      p.x = x; p.y = y;
    }
    s.cloak = TUNE.cloak;
    s.playerRouteStale = true;
    emit("super", fromX, fromY, { dir: p.dir, ability: "dash", toX: p.x, toY: p.y });
  }
  function addCharge() {
    if (s.charge >= s.need) return;
    s.charge++;
    if (s.charge === s.need) emit("superReady", s.player.x, s.player.y);
  }
  function killPlayer() {
    const p = s.player;
    p.alive = false;
    p.hp = 0;
    emit("playerDown", p.x, p.y);
    s.lives--; s.livesLost++; s.star = 0; s.starTimer = 0; s.cloak = 0;
    s.respawnTimer = TUNE.respawn;
    if (s.lives <= 0) { s.phase = "over"; s.reason = "lives"; }
  }

  function updateSpawner(dt) {
    if (!s.spawns.length) return;
    if (s.cursor >= s.waves.length) {
      // In an assault the defenders keep coming until their reactor falls.
      if (s.mode !== "assault" || !s.waves.length) return;
      s.cursor = 0; s.looped = true;
    }
    s.spawnTimer -= dt;
    const max = s.mode === "assault" ? Math.max(2, s.settings.maxEnemies - 1) : s.settings.maxEnemies;
    if (s.spawnTimer > 0 || s.enemies.length >= max) return;
    const kind = s.waves[s.cursor], k = KINDS[kind] || KINDS.R, isBoss = kind === "X";
    if (isBoss && s.looped) { s.cursor++; return; }
    // The boss waits for the field to clear a little, and always comes from the middle gate.
    if (isBoss && s.enemies.length > 1) return;
    // In survival the gate is picked at random, so waiting by one gate does not work.
    const start = s.mode === "survival" && !isBoss ? Math.floor(Math.random() * s.spawns.length) : s.spawnerIndex;
    for (let i = 0; i < s.spawns.length; i++) {
      const index = isBoss ? (Math.floor(s.spawns.length / 2) + i) % s.spawns.length : (start + i) % s.spawns.length;
      const [cx, cy] = s.spawns[index];
      if (anyTankAt(cx + .5, cy + .5)) continue;
      const bossNumber = s.mode === "survival" ? Math.floor(s.wave / TUNE.bossEvery) : s.mode === "assault" ? 1 + Math.floor(s.level / 2) : Math.floor(s.level / TUNE.bossEvery) + 1;
      const hp = isBoss ? bossHp(bossNumber) : k.hp;
      s.enemies.push({ id: s.nextId++, kind: KINDS[kind] ? kind : "R", x: cx + .5, y: cy + .5, dir: Down, want: Down, speed: k.speed * s.settings.speed, role: roleFor(kind), hold: 0, lineIn: 0, hp, maxHp: hp, alive: true, moving: false,
        spawn: TUNE.spawnFlash * (isBoss ? 2 : 1), shield: 0, slide: 0, carrier: isBoss || (s.cursor + 1) % TUNE.carrierEvery === 0, think: rnd(.3, 1), fireIn: isBoss ? 1.5 : rnd(.6, 1.6),
        stun: 0, mineIn: rnd(1.5, TUNE.mineEvery), fixIn: TUNE.fixEvery });
      if (isBoss) emit("boss", cx + .5, cy + .5);
      s.cursor++;
      s.spawnerIndex = (start + i + 1) % s.spawns.length;
      s.spawnTimer = s.settings.spawnDelay * (s.mode === "assault" ? TUNE.assaultSpawnDelay : 1);
      return;
    }
  }
  function roleFor(kind) {
    if (s.mode === "assault") {
      // Defenders: some guard their reactor, the rest hunt the attacker.
      if (kind === "F") return "guard";
      return kind !== "K" && kind !== "X" && s.cursor % 3 === 0 ? "guard" : "hunter";
    }
    if (kind === "X") return "breaker";
    if (kind === "K") return "breaker";
    if (kind === "M") return "hunter";
    if (kind === "F") return "rusher";
    if (kind === "S") return "rusher";
    if (kind === "G") return "hunter";
    if (kind === "H") return "breaker";
    return s.cursor % 2 === 0 ? "hunter" : "rusher";
  }
  function openOrCrate(e, dir) {
    const x = Math.floor(e.x) + DX[dir], y = Math.floor(e.y) + DY[dir];
    if (!inBounds(x, y)) return false;
    const t = s.tiles[x][y];
    return !solid(t) || t === T.Crate || t === T.Base;
  }
  function randomOpen(e) {
    const start = Math.floor(Math.random() * 4);
    for (let i = 0; i < 4; i++) {
      const d = (start + i) % 4, x = Math.floor(e.x) + DX[d], y = Math.floor(e.y) + DY[d];
      if (inBounds(x, y) && !solid(s.tiles[x][y])) return d;
    }
    return start;
  }
  function crateAhead(e) {
    const x = Math.floor(e.x) + DX[e.dir], y = Math.floor(e.y) + DY[e.dir];
    return inBounds(x, y) && s.tiles[x][y] === T.Crate;
  }
  // Route maps: each cell holds the cost of getting from there to the target.
  // Crates are passable at a cost because they can be shot away.
  function buildRoute(targetX, targetY, crateCost) {
    const route = [];
    for (let x = 0; x < W; x++) route.push(new Array(H).fill(Infinity));
    route[targetX][targetY] = 0;
    const queue = [[targetX, targetY]];
    while (queue.length) {
      const [cx, cy] = queue.shift();
      const isTarget = cx === targetX && cy === targetY;
      const cost = route[cx][cy] + (isTarget ? 0 : s.tiles[cx][cy] === T.Crate ? crateCost : 1);
      for (let d = 0; d < 4; d++) {

    if (r.life <= 0) { worldRoot.remove(r.m); rings.splice(i, 1); continue; }
    const k = 1 - r.life / r.max;
    r.m.scale.setScalar(.2 + k * r.size);
    r.m.material.opacity = r.life / r.max * .8;
  }
  const b = sim.bonus;
  if (!b || !bonusView || bonusViewKind !== b.kind) {
    if (bonusView) worldRoot.remove(bonusView);
    bonusView = null;
    if (b) {
      bonusView = buildBonus(b.kind);
      worldRoot.add(bonusView);
      bonusViewKind = b.kind;
    }
  }
  if (b && bonusView) {
    bonusView.visible = b.timer > 3 || ((clock * 5) % 1) < .6;
    bonusView.position.set(b.x + .5, 0, b.y + .5);
    bonusView.icon.position.y = .62 + Math.sin(clock * 3) * .06;
    // Rocks instead of spinning, so the shape never turns edge-on to the camera.
    bonusView.icon.children[0].rotation.y = Math.sin(clock * 2) * .6;
  }
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.life -= dt;
    if (d.life <= 0) { worldRoot.remove(d.m); debris.splice(i, 1); continue; }
    d.vy -= 9 * dt;
    d.m.position.x += d.vx * dt; d.m.position.y += d.vy * dt; d.m.position.z += d.vz * dt;
    d.m.rotation.x += 7 * dt; d.m.rotation.y += 5 * dt;
  }
  syncWater();
  syncTracks(dt);
  syncSmoke(dt);
  if (reactorCore) {
    // The enemy reactor beats faster as it weakens.
    const rate = sim.mode === "assault" && sim.coreMax ? 3 + 9 * (1 - sim.coreHp / sim.coreMax) : 3;
    const p = .34 + Math.sin(clock * rate) * .03; reactorCore.scale.set(p, .2, p);
  }
  camera.position.set(home.x + (Math.random() - .5) * shake * .5, home.y + (Math.random() - .5) * shake * .5, home.z);
  shake = Math.max(0, shake - dt * 1.2);
}

function fitCamera() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  camera.rotation.set(-62 * Math.PI / 180, 0, 0);
  const forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
  const centre = new THREE.Vector3(W / 2, 0, H / 2);
  const corners = [[-.4, 0, H + .4], [W + .4, 0, H + .4], [-.4, .7, -.4], [W + .4, .7, -.4]].map(c => new THREE.Vector3(c[0], c[1], c[2]));
  // Screen share kept free for the status strip and the thumb controls, same as CameraRig.cs.
  const hudShare = .08, bottomShare = .2;
  const span = () => {
    camera.updateMatrixWorld();
    let minY = 9, maxY = -9, minX = 9, maxX = -9;
    for (const c of corners) {
      const p = c.clone().project(camera);
      const x = (p.x + 1) / 2, y = (p.y + 1) / 2;
      minY = Math.min(minY, y); maxY = Math.max(maxY, y); minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    }
    return { minY, maxY, minX, maxX };
  };
  for (let d = 8; d < 90; d += .1) {
    camera.position.copy(centre).addScaledVector(forward, -d);
    const r = span();
    if (r.minX > .01 && r.maxX < .99 && r.maxY - r.minY < 1 - hudShare - bottomShare) break;
  }
  for (let i = 0; i < 300; i++) {
    const r = span();
    const error = ((1 - hudShare) - r.maxY) - (r.minY - bottomShare);
    if (Math.abs(error) < .004) break;
    camera.position.z += error > 0 ? .02 : -.02;
  }
  home.copy(camera.position);
  if (splash) aimSplashCamera();
}

let audio = null, muted = false;
function initAudio() {

  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
function tone(from, to, seconds, volume, type) {
  if (!audio || muted) return;
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(from, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(to, 20), t + seconds);
  g.gain.setValueAtTime(volume, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + seconds);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + seconds);
}
function noise(seconds, volume) {
  if (!audio || muted) return;
  const n = Math.floor(audio.sampleRate * seconds), buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;

}

  const box = $("stick").getBoundingClientRect();

  const len = Math.hypot(dx, dy), reach = box.width * .3, deadZone = box.width * .09;
  const shown = len > reach ? reach / len : 1;

    tank: "guard", owned: ["guard"], stars: [], assaultUnlocked: 0, assaultStars: [], awards: [],
    counters: { kills: 0, bosses: 0, crates: 0, mines: 0, abilities: 0, turrets: 0, flawless: 0 } };
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { stored = null; }

  if (!TANKS[data.tank] || !data.owned.includes(data.tank)) data.tank = "guard";

function handleEvents() {
  for (const e of sim.events) {
    if (e.kind === "shot") { if (e.isPlayer) tone(620, 180, .09, .07); else tone(380, 140, .08, .025); }
    else if (e.kind === "tile") { refreshTile(sim, e.x, e.y); if (e.debris) burst(e.x + .5, e.y + .5, 0xA9713C, 5, 2.2); }
    else if (e.kind === "spark") { burst(e.x, e.y, 0xFFE9A8, 3, 1.6); tone(1400, 900, .05, .02); }
    else if (e.kind === "tankHit") { burst(e.x, e.y, 0xFFB057, 8, 2.4); tone(900, 500, .07, .05); }
    else if (e.kind === "tankDown") { smoke(e.x, e.y, e.boss ? 10 : 5, e.boss ? .8 : .5); smoulder(e.x, e.y, e.boss ? 5 : 2.5); burst(e.x, e.y, 0xFF8A3D, 18, 3.4); noise(.3, .22); shake = Math.max(shake, .12); save.counters.kills++; if (e.boss) save.counters.bosses++; }
    else if (e.kind === "playerDown") { smoke(e.x, e.y, 7, .55); smoulder(e.x, e.y, 3); burst(e.x, e.y, 0x6FF2E0, 24, 3.8); noise(.6, .3); shake = Math.max(shake, .3); vibrate(120); }
    else if (e.kind === "baseHit") { smoke(e.x, e.y, 5, .5); burst(e.x, e.y, 0x6FF2E0, 20, 3.4); noise(.5, .3); shake = Math.max(shake, .35); vibrate(90); showToast("Реактор повреждён: осталось " + sim.baseHp); }
    else if (e.kind === "baseDown") { smoke(e.x, e.y, 12, .9); smoulder(e.x, e.y, 8); burst(e.x, e.y, 0x6FF2E0, 40, 5); noise(.8, .35); shake = .5; }
    else if (e.kind === "bomb") { noise(.6, .3); shake = .4; }
    else if (e.kind === "playerHit") { burst(e.x, e.y, 0x6FF2E0, 10, 2.6); noise(.25, .2); shake = Math.max(shake, .15); vibrate(40); }
    else if (e.kind === "super") {
      save.counters.abilities++;
      vibrate(80);
      if (e.ability === "volley") { burst(e.x, e.y, 0xFFA040, 16, 3); ring(e.x, e.y, 0xFFA040, 1.6, .35); noise(.4, .25); tone(300, 900, .2, .07, "sawtooth"); shake = .25; }
      else if (e.ability === "dome") { ring(e.x, e.y, 0x9CFF5A, TUNE.domeRange, .6); ring(e.x, e.y, 0x6FF2E0, TUNE.domeRange * .7, .45); tone(180, 720, .5, .08, "triangle"); shake = .2; }
      else if (e.ability === "dash") {
        const steps = 8;
        for (let i = 0; i <= steps; i++) burst(e.x + (e.toX - e.x) * i / steps, e.y + (e.toY - e.y) * i / steps, 0xC060FF, 2, 1.2);
        tone(900, 200, .25, .06, "sawtooth");
      }
      else { strikeBeam(e.x, e.y, e.dir); noise(.7, .32); tone(220, 1600, .35, .08, "sawtooth"); shake = .45; }
    }
    else if (e.kind === "mineLaid") tone(260, 220, .06, .02, "triangle");
    else if (e.kind === "mineBlast") { smoke(e.x, e.y, 3, .4); burst(e.x, e.y, 0xFF5A3C, 16, 3.2); ring(e.x, e.y, 0xFF5A3C, 1.2, .4); noise(.4, .28); shake = Math.max(shake, .2); vibrate(60); }
    else if (e.kind === "mineShot") { burst(e.x, e.y, 0xFFB057, 10, 2.4); ring(e.x, e.y, 0xFFB057, .9, .3); noise(.2, .15); save.counters.mines++; }
    else if (e.kind === "heal") { burst(e.x, e.y, 0x7CE05A, 4, 1.2); tone(700, 1100, .08, .02, "triangle"); }
    else if (e.kind === "ramBlast") { smoke(e.x, e.y, 8, .7); smoulder(e.x, e.y, 2); burst(e.x, e.y, 0xFF7A2A, 26, 4); ring(e.x, e.y, 0xFF7A2A, TUNE.ramBlast + .4, .5); noise(.6, .32); shake = Math.max(shake, .35); }
    else if (e.kind === "crate") save.counters.crates++;
    else if (e.kind === "turretDown") { smoke(e.x, e.y, 6, .6); smoulder(e.x, e.y, 4); burst(e.x, e.y, 0xFF5A3C, 20, 3.6); noise(.4, .25); shake = Math.max(shake, .2); save.counters.turrets++; }
    else if (e.kind === "coreHit") { burst(e.x, e.y, 0xFF5A3C, 6, 2.2); tone(500, 300, .08, .05); }
    else if (e.kind === "coreDown") { smoke(e.x, e.y, 14, 1); smoulder(e.x, e.y, 10); burst(e.x, e.y, 0xFF5A3C, 50, 5.5); ring(e.x, e.y, 0xFF5A3C, 5, .9); noise(1, .4); shake = .6; vibrate(150); showToast("Вражеский реактор уничтожен!"); }
    else if (e.kind === "superReady") { tone(440, 1320, .22, .07, "triangle"); showToast(ABILITY_NAME[sim.ability()] + " готов!"); }
    else if (e.kind === "boss") { noise(.6, .3); shake = .3; showToast("Босс на поле!"); }
    else if (e.kind === "pickup") { burst(e.x, e.y, BONUS_COLOR[e.bonus], 10, 2.4); tone(440, 1320, .22, .07, "triangle"); showToast(BONUS_TEXT[e.bonus]); }
  }
  sim.events.length = 0;
}

// Stores parts, records and newly opened levels as soon as a level or wave ends, then shows the result.
function checkPhase() {
  if (state !== "playing" || sim.phase === "playing") return;
  lastParts = sim.takeParts();
  save.parts += lastParts;
  save.best = Math.max(save.best, sim.score);
  const won = sim.phase === "cleared" || sim.phase === "victory";
  if (sim.mode === "survival") save.bestWave = Math.max(save.bestWave, sim.phase === "choice" ? sim.wave : sim.wave - 1);
  else if (sim.mode === "assault") {
    if (won) {
      save.assaultStars[sim.level] = Math.max(save.assaultStars[sim.level] | 0, sim.starsWon);
      save.assaultUnlocked = Math.max(save.assaultUnlocked, Math.min(sim.level + 1, ASSAULT.length - 1));
    }
  } else if (won) {
    save.stars[sim.level] = Math.max(save.stars[sim.level] | 0, sim.starsWon);
    if (sim.phase === "cleared") save.unlocked = Math.max(save.unlocked, Math.min(sim.level + 1, LEVELS.length - 1));
  }
  if (won && sim.livesLost === 0) save.counters.flawless++;
  checkAwards();
  setPlayingChrome(false);
  $("hud").hidden = false;
  if (sim.phase === "choice") { state = "choice"; showWaveChoice(); return; }
  state = "ended";
  const tiles = document.createElement("div");
  tiles.className = "result";
  for (const [value, label] of [[sim.score, "очки"], [save.best, "рекорд"], ["+" + lastParts, "деталей"]]) {
    const d = document.createElement("div"), b = document.createElement("b"), s = document.createElement("span");
    b.textContent = value; s.textContent = label; d.append(b, s); tiles.appendChild(d);
  }
  const where = sim.mode === "survival" ? "Волна " + sim.wave + "." : sim.levelName() + ".";
  // Stars won, with what each one was for.
  const stars = document.createElement("div");
  stars.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:4px";
  if (won) {
    const big = document.createElement("div"); big.className = "bigStars"; big.innerHTML = starText(sim.starsWon); stars.appendChild(big);
    const why = document.createElement("p");
    why.textContent = "Победа" + (sim.livesLost === 0 ? " · без потерь" : "") + (sim.time <= sim.par() ? " · быстрее " + Math.round(sim.par()) + " с" : " · норма " + Math.round(sim.par()) + " с");
    stars.appendChild(why);
  }
  const above = won ? stars : null;
  if (sim.mode === "assault" && sim.phase === "cleared") screen("Крепость взята", where, [["Дальше", nextLevel, "next"], ["В меню", toMenu, "home"]], tiles, false, { art: "victory", tone: "win", above });
  else if (sim.mode === "assault" && sim.phase === "victory") screen("Все крепости взяты!", "Вражеские реакторы погашены.", [["В меню", toMenu, "home"]], tiles, false, { art: "victory", tone: "win", above });
  else if (sim.phase === "cleared") screen("Уровень пройден", where, [["Дальше", nextLevel, "next"], ["В меню", toMenu, "home"]], tiles, false, { art: "victory", tone: "win", above });
  else if (sim.phase === "victory") screen("Рубеж удержан!", "Все 20 уровней пройдены.", [["Штурм", showAssault, "assault"], ["В меню", toMenu, "home"]], tiles, false, { art: "victory", tone: "win", above });
  else screen(sim.reason === "base" ? "Реактор уничтожен" : "Танки закончились", where, [["Ещё раз", retry, "retry"], ["Гараж", () => { toMenu(); showGarage(); }, "tank"], ["В меню", toMenu, "home"]], tiles, false, { art: "defeat", tone: "lose" });
}
const UPGRADE_ICON = { armor: "armor", gun: "gun", fire: "rate", speed: "speed", repair: "repair", super: "charge", fort: "fort" };
function showWaveChoice() {
  const box = document.createElement("div");
  box.className = "choices";
  for (const choice of sim.choices) {
    const b = document.createElement("button"), title = document.createElement("strong"), note = document.createElement("span");
    title.textContent = UPGRADE_TEXT[choice][0]; note.textContent = UPGRADE_TEXT[choice][1];
    const badge = document.createElement("div"); badge.className = "icon"; badge.appendChild(icon(UPGRADE_ICON[choice] || "charge"));
    b.append(badge, title, note);
    b.addEventListener("click", () => {
      initAudio();
      sim.chooseUpgrade(choice);
      state = "playing";
      $("overlay").hidden = true;
      setPlayingChrome(true);
      last = performance.now();
    });
    box.appendChild(b);
  }
  screen("Волна " + sim.wave + " отбита", "+" + lastParts + " деталей. Выбери улучшение:", [], box, false, { art: "arena", tone: "win" });
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, .1);
  last = now;
  if (state === "playing") {
    readInput();
    accumulator += dt;
    while (accumulator >= STEP) { sim.tick(STEP, input); accumulator -= STEP; }
    handleEvents();
    updateHud();
    checkPhase();
  }
  syncWorld(sim, state === "paused" ? 0 : dt);
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $("toast").classList.remove("on"); }
  else if (toasts.length) showToast(toasts.shift());
  renderer.render(scene, camera);
}

window.__steelLine = { sim, renderer, camera, get state() { return state; }, get save() { return save; }, startGame, startLevel, startSurvival, startAssault, showLevels, showAssault, showGarage, showAwards, showWorkshop, showSettings, writeSave, checkAwards };
// ---- Loading screen: the reactor charges while the player's tank circles it ----
const SPLASH = { radius: 3, turnRate: 1.9, chargeSeconds: 2.4, turnSeconds: .25, shotSeconds: .55, topAngle: Math.PI * 1.5 };
let splash = null;

function aimSplashCamera() {
  const centre = new THREE.Vector3(W / 2, 0, H / 2);
  camera.rotation.set(-62 * Math.PI / 180, 0, 0);
  const forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
  const edge = SPLASH.radius + 1.4;
  const corners = [[-edge, 0], [edge, 0], [0, -edge], [0, edge]].map(c => new THREE.Vector3(centre.x + c[0], 0, centre.z + c[1]));
  for (let d = 6; d < 60; d += .1) {
    camera.position.copy(centre).addScaledVector(forward, -d);
    camera.updateMatrixWorld();
    if (corners.every(c => { const p = c.clone().project(camera); return Math.abs(p.x) < .96 && Math.abs(p.y) < .62; })) break;
  }
}
function startSplash() {
  const group = new THREE.Group();
  group.position.set(W / 2, 0, H / 2);
  worldRoot.add(group);

  const floor = new THREE.Mesh(new THREE.CircleGeometry(SPLASH.radius + 1.3, 56), new THREE.MeshLambertMaterial({ color: 0x3A3040 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  group.add(floor);
  const track = new THREE.Mesh(new THREE.RingGeometry(SPLASH.radius - .55, SPLASH.radius + .55, 64), new THREE.MeshLambertMaterial({ color: 0x4B3F50 }));
  track.rotation.x = -Math.PI / 2;
  track.position.y = .005;
  track.receiveShadow = true;
  group.add(track);

  const reactor = new THREE.Group();
  reactor.scale.setScalar(1.7);
  group.add(reactor);
  const core = buildReactor(reactor);
  core.material = new THREE.MeshLambertMaterial({ color: 0x6FF2E0, emissive: 0x6FF2E0, emissiveIntensity: .1 });

  // Three arcs on the floor light up as the charge grows, like the bar below.
  const arcs = [];
  for (let i = 0; i < 3; i++) {
    const m = new THREE.MeshBasicMaterial({ color: 0x4A4552 });
    const arc = new THREE.Mesh(new THREE.RingGeometry(1.25, 1.5, 24, 1, i * Math.PI * 2 / 3 + .08, Math.PI * 2 / 3 - .16), m);
    arc.rotation.x = -Math.PI / 2;
    arc.position.y = .012;
    group.add(arc);
    arcs.push(m);
  }

  const view = buildTank({ isPlayer: true, kind: "P", model: TANKS[save.tank].model });
  view.ring.visible = view.bar.visible = view.shield.visible = false;
  group.add(view.root);

  const shot = new THREE.Mesh(unitBox, mat(0xFFE9A8, true));
  shot.scale.set(.2, .2, .42);
  shot.visible = false;
  group.add(shot);

  splash = {
    group, core, arcs, view, shot,
    angle: SPLASH.topAngle - SPLASH.turnRate * SPLASH.chargeSeconds,
    time: 0, real: 0, loaded: false, phase: "charging", phaseTime: 0, previous: performance.now()
  };
  $("splash").hidden = false;
  aimSplashCamera();
  requestAnimationFrame(splashFrame);
}
function placeSplashTank(s) {
  s.view.root.position.set(Math.cos(s.angle) * SPLASH.radius, 0, Math.sin(s.angle) * SPLASH.radius);
}
function splashFrame(now) {
  const s = splash;
  if (!s) return;
  const dt = Math.min((now - s.previous) / 1000, .1);
  s.previous = now;
  s.time += dt;
  s.phaseTime += dt;

  // The bar follows real loading but never hurries past the animation.
  const charge = Math.min(s.real, s.time / SPLASH.chargeSeconds);
  showSplashCharge(s, charge);

  if (s.phase === "charging" || s.phase === "arriving") {
    s.angle += SPLASH.turnRate * dt;
    placeSplashTank(s);
    s.view.root.rotation.y = Math.PI - s.angle;
    s.view.model.position.y = Math.sin(s.time * 30) * .012;
    if (s.phase === "charging" && charge >= 1 && s.loaded) { s.phase = "arriving"; s.phaseTime = 0; }
    if (s.phase === "arriving") {
      const toTop = Math.atan2(Math.sin(SPLASH.topAngle - s.angle), Math.cos(SPLASH.topAngle - s.angle));
      if (Math.abs(toTop) < .25) { s.phase = "turning"; s.phaseTime = 0; s.turnFrom = s.view.root.rotation.y; }
    }
  } else if (s.phase === "turning") {
    s.view.root.rotation.y = angleTo(s.view.root.rotation.y, 0, 12 * dt);
    if (s.phaseTime >= SPLASH.turnSeconds) {
      s.view.root.rotation.y = 0;
      s.phase = "firing"; s.phaseTime = 0;
      s.shot.visible = true;
      s.shot.position.set(s.view.root.position.x, .5, s.view.root.position.z - 1);
      $("splash").classList.add("hit");
    }
  } else if (s.phase === "firing") {
    s.shot.position.z -= 16 * dt;
    $("splashFlash").style.opacity = String(Math.max(0, 1 - Math.abs(s.phaseTime - .3) * 5));
    if (s.phaseTime >= SPLASH.shotSeconds) { finishSplash(); return; }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(splashFrame);
}
function showSplashCharge(s, charge) {
  const third = 1 / s.arcs.length;
  s.arcs.forEach((m, i) => m.color.setHex(charge >= (i + 1) * third - .001 ? 0x35F2D0 : 0x4A4552));
  s.core.material.emissiveIntensity = .1 + charge * 1.3;
  const size = .34 + charge * .1 + Math.sin(s.time * 8) * .012 * charge;
  s.core.scale.set(size, .2, size);
  document.querySelectorAll("#splashBar i").forEach((seg, i) => {
    seg.firstChild.style.width = Math.max(0, Math.min(1, (charge - i * third) / third)) * 100 + "%";
  });
  $("splashPercent").textContent = Math.round(charge * 100) + "%";
}
function finishSplash() {
  worldRoot.remove(splash.group);
  splash = null;
  $("splash").hidden = true;
  fitCamera();
  buildLevel(sim);
  syncWorld(sim, 0);
  renderer.render(scene, camera);
  showTitle();
  last = performance.now();
  requestAnimationFrame(frame);
}
fitCamera();
const loadBonus = name => loadGeometry("bonuses/" + name + ".json").then(g => { bonusGeo[name] = g; });
const splashModel = TANKS[save.tank].model;
loadModel(splashModel).then(() => {
  startSplash();
  const jobs = MODEL_NAMES.filter(n => n !== splashModel).map(loadModel).concat(TILE_NAMES.map(loadTile), Object.values(BONUS_MODEL).map(loadBonus));
  let done = 0;
  jobs.forEach(job => job.then(() => { done++; if (splash) splash.real = done / jobs.length; }));
  return Promise.all(jobs);
}).then(() => {
  splash.loaded = true;
}).catch(() => {
  splash = null;
  $("splash").hidden = true;
  screen("Модели не загрузились", "Проверь соединение и обнови страницу.", [["Обновить", () => location.reload(), "retry"]], null, false, { art: "defeat" });
});
