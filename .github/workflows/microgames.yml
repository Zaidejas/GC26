name: microgames

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Only own folder
        run: python tools/check_scope.py --base origin/main
      - name: Naming rules
        run: python tools/check_names.py
